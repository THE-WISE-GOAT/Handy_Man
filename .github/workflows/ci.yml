# Continuous integration — runs on every push and pull request.
#
# This is the gate that `deploy.yml` waits on: nothing is built or shipped
# until this workflow is green, so a broken commit cannot reach a server.
#
# Everything here is offline by design. The test suite stubs the database and
# the NVIDIA client (see test/conftest.py), so CI needs no Postgres service
# and no API key.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # lets deploy.yml reuse this job rather than duplicating it

concurrency:
  # A newer push to the same branch makes an in-flight run obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfile base image
          cache: pip

      # requirements.txt is UTF-16 (written by PowerShell redirection on
      # Windows). pip cannot read it, so it is transcoded to UTF-8 into a
      # temporary file here rather than modifying the committed file.
      - name: Normalise requirements encoding
        run: |
          python - <<'PY'
          from pathlib import Path

          raw = Path("requirements.txt").read_bytes()
          for encoding in ("utf-16", "utf-8-sig", "utf-8"):
              try:
                  text = raw.decode(encoding)
                  print(f"decoded requirements.txt as {encoding}")
                  break
              except UnicodeDecodeError:
                  continue
          else:
              raise SystemExit("could not decode requirements.txt")

          Path("requirements.ci.txt").write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # psycopg2 (source build) needs libpq headers, same as the Dockerfile.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev
          pip install -r requirements.ci.txt

      - name: Run test suite
        # The suite is database-free; these placeholders only satisfy Settings
        # validation at import time. No real credentials are involved.
        env:
          DATABASE_HOSTNAME: localhost
          DATABASE_PORT: "5432"
          POSTGRES_EXPOSE_PORT: "5432"
          DATABASE_NAME: handyman_test
          DATABASE_USERNAME: test_user
          DATABASE_PASSWORD: test_password
          PUBLIC_API_URL: http://127.0.0.1:8000
          SECRET_KEY: ci-secret-key-not-used-outside-tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          NVIDIA_API_KEY: nvapi-ci-placeholder-never-called
          GEMINI_API_KEY: ci-placeholder-never-called
        run: pytest test/ -v --durations=10

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches frontend/user_app/Dockerfile
          cache: npm
          cache-dependency-path: frontend/user_app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/user_app
        run: npm ci

      # A build failure here is the most common way a deploy breaks, since the
      # production image compiles the bundle inside Docker where the error
      # surfaces much later.
      - name: Build
        working-directory: frontend/user_app
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same UTF-16 problem as the test job — without this the backend image
      # fails at `pip install -r requirements.txt`. Build context only; the
      # committed file is unchanged.
      - name: Normalise requirements encoding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          raw = Path("requirements.txt").read_bytes()
          for encoding in ("utf-16", "utf-8-sig", "utf-8"):
              try:
                  text = raw.decode(encoding)
                  break
              except UnicodeDecodeError:
                  continue
          else:
              raise SystemExit("could not decode requirements.txt")

          Path("requirements.txt").write_text(text, encoding="utf-8")
          PY

      # Build only — no push. Confirms both Dockerfiles are still valid before
      # a release tag tries to publish them for real.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/user_app/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
