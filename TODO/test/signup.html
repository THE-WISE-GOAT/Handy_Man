<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .response-box {
            margin-top: 20px;
            padding: 10px;
            background-color: #eee;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        
        <!-- Input Fields -->
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <!-- Submit Button -->
        <button onclick="sendSignupData()">Sign Up</button>

        <!-- Box to show response from FastAPI -->
        <div id="response" class="response-box"></div>
    </div>

    <script>
        // Change this URL if your backend runs on a different port or address
        const API_URL = "http://127.0.0.1:8000/users";


        async function sendSignupData() {
            // 1. Grab values from the input boxes
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 2. Simple check to ensure fields are not empty
            if (!username || !email || !password) {
                alert("Please fill in all fields.");
                return;
            }

            const responseBox = document.getElementById('response');

            try {
                // 3. Send data to FastAPI backend as JSON
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                // 4. Read response data
                const data = await response.json();

                // 5. Display response on the screen
responseBox.style.display = "block";

if (response.status === 201 || response.ok) {
    // Styling for a beautiful success block
    responseBox.style.borderLeft = "none";
    responseBox.style.backgroundColor = "#eafaf1"; 
    responseBox.style.color = "#27ae60"; 
    responseBox.style.padding = "15px";
    responseBox.style.textAlign = "center";
    responseBox.style.borderRadius = "6px";
    responseBox.style.lineHeight = "1.6";

    // Clean, readable message layout
    responseBox.innerHTML = `
        <div style="font-size: 24px; margin-bottom: 5px;">🎉</div>
        <strong style="display: block; font-size: 15px; margin-bottom: 5px;">Account Created Successfully!</strong>
        Welcome aboard, <b>${data.username}</b>. Your account ID is <b>#${data.id}</b>.
    `;
} else {
    // Styling for error handling
    responseBox.style.borderLeft = "5px solid #dc3545";
    responseBox.style.backgroundColor = "#eee";
    responseBox.style.color = "#333";
    responseBox.style.textAlign = "left";
    responseBox.innerText = `Error: ${data.detail || "Could not register user."}`;
}

            } catch (error) {
                // Handle network connection issues
                responseBox.style.display = "block";
                responseBox.style.borderLeft = "5px solid #dc3545";
                responseBox.innerText = "Error connecting to backend server. Make sure FastAPI is running and CORS is enabled.";
            }
        }
    </script>

</body>
</html>
